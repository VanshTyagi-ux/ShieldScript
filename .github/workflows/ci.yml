name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit
      - name: The committed bundle is up to date
        run: |
          npm --prefix frontend run build
          git diff --exit-code xss_detector/static/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t xss-detector .
      - name: The compose file is valid
        run: docker compose config --quiet
      - name: Build the backend and frontend images
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 240
      - name: Smoke test through nginx, the backend and the database
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          # /api/ is forwarded to the backend, which has loaded the payloads into PostgreSQL
          curl -fsS http://localhost:3000/api/v1/payloads/facets | grep -Eq '"total":[1-9][0-9]+'
          curl -fsS -X POST http://localhost:3000/api/v1/sanitize -H 'Content-Type: application/json' \
            -d '{"html":"<script>x</script><b>ok</b>"}' | grep -q '"clean":"<b>ok</b>"'
      - name: Service logs (only when something failed)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
