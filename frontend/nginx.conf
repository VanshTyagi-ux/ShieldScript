# nginx site for the frontend container: serves the static site from /usr/share/nginx/html and forwards /api/ to the
# backend. Installed as /etc/nginx/conf.d/default.conf in nginx-unprivileged, which runs as a normal user and so
# listens on 8080, not 80.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. The backend's address is looked up per request (see /api/ below) rather than once at
    # start-up, so nginx starts and recovers even when the backend container is not up yet or was recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The same headers as the built-in Python server sends. Every location inherits them: none below sets its own
    # add_header, because that would replace these instead of adding to them.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json image/svg+xml;

    # The backend answers 413 (as JSON) above 256 KiB; nginx only guards against far larger bodies.
    client_max_body_size 1m;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API. ^~ makes this win over the file-extension rule below. With a variable and no URI part, proxy_pass
    # sends the request path and query unchanged, so /api/v1/scan reaches the backend as /api/v1/scan.
    location ^~ /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Files are revalidated on every load (they carry an ETag, so an unchanged file costs a 304): a redeploy is
    # never stale. The bundle is not fingerprinted, so it cannot be cached for longer.
    location = /index.html { expires -1; }
    location = /app.js { expires -1; }

    # A path with a file extension is a file or nothing; it is never the app (matches the built-in server).
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app, which draws its own "not found" page.
    location / {
        try_files $uri /index.html;
    }

    absolute_redirect off;
}
